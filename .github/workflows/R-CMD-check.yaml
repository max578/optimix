# Release-grade check across platforms, plus a zero-Suggests job that
# mechanises the package's independence claim: the base solver, the native
# mapper, and every fallback path must work with no suggested engine
# installed (only the hard dependencies plus the test/vignette toolchain).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # proxymix (a suggested engine) is a private federation package with no
      # public repository, so the resolver cannot install it and the check
      # must not require it; its tests skip when it is absent.
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Hard dependencies plus the CRAN-resolvable Suggests, named explicitly
      # so the unresolvable proxymix is never requested.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            any::GenSA
            any::DEoptim
            any::DEoptimR
            any::dfoptim
            any::nloptr
            any::cmaes
            any::DiceKriging
            any::smoof
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  zero-suggests:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, hard deps only)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Suggests are deliberately absent; the check must not require them.
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
